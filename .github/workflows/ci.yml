name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# A new push to the same branch makes the in-flight run pointless. Cancelling
# it keeps queues short and stops a stale run reporting on old code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. This workflow only reads code; the registry push added
# later will raise `packages: write` on that job alone, not here.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # --------------------------------------------------------------- lint ----
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # --output-format=github makes failures appear as inline annotations
      # on the PR diff instead of only in the log.
      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

  # --------------------------------------------------------------- test ----
  test:
    name: Test
    runs-on: ubuntu-latest

    # GitHub runs this container on the runner for the life of the job.
    # It is thrown away afterwards, so migrations always meet an empty
    # database -- which is the point.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb_test
        ports:
          - 5432:5432
        # Without a healthcheck the steps start before Postgres accepts
        # connections and the job fails intermittently. Flaky-green CI is
        # worse than honest-red CI.
        options: >-
          --health-cmd "pg_isready -U app -d appdb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Steps run directly on the runner, not inside the Docker network,
      # so Postgres is reached through the mapped port -- NOT by the
      # service name the way docker-compose does it.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # A throwaway keypair, generated per run. CI never sees the real
      # signing key, and this still works on pull requests from forks,
      # where repository secrets are deliberately withheld.
      - name: Generate throwaway RSA keypair
        run: make keys

      # Proves the migrations apply to a genuinely empty database. Catches
      # the migration that only works on your laptop because your local DB
      # already had the table.
      - name: Apply migrations
        run: alembic upgrade head

      # Catches "changed the model, forgot to generate the migration".
      # Exits non-zero on drift.
      - name: Check models match migrations
        run: alembic check

      - name: Run tests
        run: pytest -v

  # -------------------------------------------------------------- build ----
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # No push here -- this job runs on pull requests too, and an unreviewed
      # branch has no business putting images in the registry. It only proves
      # the Dockerfile still builds. Publishing is the `publish` job below.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: devops-learning-path:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------ publish ----
  publish:
    name: Publish image
    runs-on: ubuntu-latest

    # Only on a real push to develop -- never on a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    # The gate that matters: nothing reaches the registry unless lint, tests
    # and the image build have all gone green.
    needs: [lint, test, build]

    permissions:
      contents: read
      packages: write # scoped to this job only, not the whole workflow

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is minted per run and expires with it, so there is no
      # long-lived registry credential to store or rotate.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name for us. That matters:
      # github.repository is "Khatana-AZM/devops-learning-path" and GHCR
      # rejects uppercase, so hand-rolling the tag would fail here.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=develop

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------- deploy ----
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [publish]

    # Binds this job to the `staging` GitHub environment. Only jobs that
    # declare it can read its secrets -- the lint and test jobs physically
    # cannot reach the production database or the Vercel token.
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read

    # Exposed so the notify job can put the staging link in the Slack message.
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Migrations run BEFORE the new code ships. The other order deploys an
      # app that queries columns which don't exist yet.
      #
      # The DIRECT Neon URL, not the pooled one: PgBouncer runs in
      # transaction mode, and schema changes need a real session.
      - name: Apply migrations to staging
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DIRECT }}

      # Container support is recent -- an older CLI doesn't understand a
      # Container project and fails with a misleading package.json error.
      - name: Install Vercel CLI
        run: npm install --global vercel@65.14.0

      # No separate `vercel build`: for a Container project the image is
      # built on Vercel's infrastructure from the Dockerfile, and building
      # locally would need a Docker daemon on the runner for no benefit.
      #
      # stdout is the deployment URL; progress goes to stderr.
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # A deploy that returns a URL is not a deploy that works. This fails
      # the job if the app can't serve traffic or can't reach Postgres --
      # a half-working staging environment is worse than an obvious failure.
      #
      # Retries because the container cold-starts, and Neon's compute
      # resumes from zero on the first connection.
      - name: Verify staging is healthy
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 30 "$url/health" >/dev/null 2>&1; then
              echo "liveness ok (attempt $attempt)"
              break
            fi
            if [ "$attempt" = "10" ]; then
              echo "::error::$url/health never returned 200"
              exit 1
            fi
            sleep 10
          done

          echo "--- /health ---"
          curl -fsS --max-time 30 "$url/health"; echo
          echo "--- /health/db (proves migrations + Neon connectivity) ---"
          curl -fsS --max-time 30 "$url/health/db"; echo

  # ------------------------------------------------------------- notify ----
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest

    # Runs last, and runs even when something upstream failed -- a pipeline
    # notification that only fires on success is the wrong way round.
    needs: [lint, test, build, publish, deploy]
    if: always()

    permissions:
      contents: read

    steps:
      - name: Work out the overall result
        id: result
        run: |
          # Jobs skipped by their own `if` (publish and deploy on a PR) are
          # not failures. Only a real failure or a cancellation is.
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "status=failure"  >> "$GITHUB_OUTPUT"
            echo "colour=#d1242f"  >> "$GITHUB_OUTPUT"
            echo "emoji=:x:"       >> "$GITHUB_OUTPUT"
          elif ${{ contains(needs.*.result, 'cancelled') }}; then
            echo "status=cancelled"      >> "$GITHUB_OUTPUT"
            echo "colour=#9a6700"        >> "$GITHUB_OUTPUT"
            echo "emoji=:warning:"       >> "$GITHUB_OUTPUT"
          else
            echo "status=success"            >> "$GITHUB_OUTPUT"
            echo "colour=#1a7f37"            >> "$GITHUB_OUTPUT"
            echo "emoji=:white_check_mark:"  >> "$GITHUB_OUTPUT"
          fi

      # Guarded on the secret being present, so the pipeline keeps working
      # for anyone who hasn't configured Slack -- a missing webhook should
      # not turn a green build red.
      - name: Post to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ steps.result.outputs.status }}
          COLOUR: ${{ steps.result.outputs.colour }}
          EMOJI: ${{ steps.result.outputs.emoji }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAGING_URL: ${{ needs.deploy.outputs.url }}
          TRIGGER: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          # Built with jq so commit messages containing quotes, newlines or
          # backslashes can't break the JSON payload.
          # $'\n' is a real newline. A plain "\n" inside double quotes stays a
          # literal backslash-n and Slack renders it as those two characters.
          nl=$'\n'

          summary="*${EMOJI} CI ${STATUS}* — \`${BRANCH}\` (${TRIGGER})"
          details="<${RUN_URL}|View run> · by ${ACTOR}"
          if [ -n "$STAGING_URL" ]; then
            details="${details}${nl}:rocket: Deployed: <${STAGING_URL}|staging>"
          fi
          if [ -n "$SUBJECT" ]; then
            details="${details}${nl}\`\`\`$(printf '%s' "$SUBJECT" | head -1)\`\`\`"
          fi

          jq -n \
            --arg fallback "CI ${STATUS} on ${BRANCH}" \
            --arg colour "$COLOUR" \
            --arg summary "$summary" \
            --arg details "$details" \
            '{
               text: $fallback,
               attachments: [{
                 color: $colour,
                 blocks: [
                   { type: "section", text: { type: "mrkdwn", text: $summary } },
                   { type: "section", text: { type: "mrkdwn", text: $details } }
                 ]
               }]
             }' > payload.json

          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data @payload.json "$SLACK_WEBHOOK_URL" > /dev/null
          echo "Slack notified: ${STATUS}"

      - name: Note when Slack isn't configured
        if: env.SLACK_WEBHOOK_URL == ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: echo "::notice::SLACK_WEBHOOK_URL is not set - skipping the Slack notification."
